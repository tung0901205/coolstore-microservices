version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    container_name: coolstore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "coolstore,catalog,inventory"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init/create-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  infinispan:
    image: quay.io/infinispan/server:14.0
    container_name: coolstore-infinispan
    environment:
      USER: admin
      PASS: admin123
    ports:
      - "11222:11222"
    volumes:
      - infinispan_data:/opt/infinispan/server/data

volumes:
  postgres_data:
  infinispan_data:
