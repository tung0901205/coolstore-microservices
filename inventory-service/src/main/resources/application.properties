# S?A: ??i t? 8082 ? 8081
%dev.quarkus.http.port=8081

# CORS
quarkus.http.cors=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=Tranhuong222@
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/inventory

%prod.quarkus.datasource.username=quarkus
%prod.quarkus.datasource.password=quarkus
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://inventory-database:5432/inventory

# Hibernate - drop-and-create cho dev ?? seed d? li?u s?ch
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=import.sql

# JWT (n?u c?n b?o v? API Admin)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://coolstore.vn

# Swagger UI
quarkus.swagger-ui.always-include=true