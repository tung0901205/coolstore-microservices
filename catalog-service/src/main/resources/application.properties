# ============================================================
# CATALOG SERVICE - application.properties (NÂNG C?P)
# Port dev: 8082 (gi? nguyên)
# ============================================================

%dev.quarkus.http.port=8082

# CORS
quarkus.http.cors=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# ============================================================
# DATABASE - PostgreSQL local (thay ??i t? remote sang local)
# ============================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

# Dev: PostgreSQL ch?y local (Docker Desktop)
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/catalog

# Prod: PostgreSQL trong Docker network
%prod.quarkus.datasource.username=quarkus
%prod.quarkus.datasource.password=quarkus
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://catalog-database:5432/catalog

# Hibernate - update (không xóa d? li?u khi restart)
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=import.sql

# ============================================================
# INVENTORY SERVICE CLIENT - ??i sang localhost dev
# ============================================================
%dev.quarkus.rest-client."org.coolstore.catalog.resource.client.InventoryService".url=http://localhost:8081
%prod.quarkus.rest-client."org.coolstore.catalog.resource.client.InventoryService".url=http://inventory-service:8081
quarkus.rest-client."org.coolstore.catalog.resource.client.InventoryService".scope=jakarta.inject.Singleton

# ============================================================
# JWT - Xác th?c token t? auth-service
# Ph?i copy publicKey.pem t? auth-service sang th? m?c resources này
# ============================================================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://coolstore.vn

# Swagger UI
quarkus.swagger-ui.always-include=true