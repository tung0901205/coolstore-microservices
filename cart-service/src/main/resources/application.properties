# ============================================================
# CART SERVICE - application.properties (?Ã S?A L?I)
# S?A: Thêm c?u hình Infinispan cho môi tr??ng DEV (localhost)
# ============================================================

%dev.quarkus.http.port=8084

quarkus.swagger-ui.always-include=true
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.level=INFO

# CORS
quarkus.http.cors=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# ============================================================
# INFINISPAN - Cache cho Gi? hàng
# ============================================================

# DEV: Infinispan ch?y local qua Docker (docker compose up -d)
# Container: coolstore-infinispan, port: 11222
# Username/Password: admin/admin123 (c?u hình trong docker-compose.yml)
%dev.quarkus.infinispan-client.hosts=localhost:11222
%dev.quarkus.infinispan-client.use-auth=true
%dev.quarkus.infinispan-client.username=admin
%dev.quarkus.infinispan-client.password=admin123
%dev.quarkus.infinispan-client.client-intelligence=BASIC

# PROD: Infinispan trên OpenShift/Kubernetes
%prod.quarkus.infinispan-client.hosts=nyc.nyc.svc.cluster.local:11222
%prod.quarkus.infinispan-client.use-auth=true
%prod.quarkus.infinispan-client.username=developer
%prod.quarkus.infinispan-client.password=idCTQmnZvAWpcffs
%prod.quarkus.infinispan-client.trust-store=/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
%prod.quarkus.infinispan-client.trust-store-type=pem

# Health check
quarkus.infinispan-client.health.enabled=true

# OpenShift extension
quarkus.kubernetes-client.trust-certs=true
quarkus.openshift.route.expose=true