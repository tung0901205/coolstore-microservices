# ============================================================
# AUTH SERVICE - application.properties
# Port dev: 8089
# ============================================================

%dev.quarkus.http.port=8089

# CORS - cho phép frontend Angular g?i API
quarkus.http.cors=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# PostgreSQL - dùng chung database v?i catalog
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

# Dev: k?t n?i local PostgreSQL
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coolstore

# Prod: k?t n?i PostgreSQL trong Docker
%prod.quarkus.datasource.username=quarkus
%prod.quarkus.datasource.password=quarkus
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://auth-database:5432/coolstore

# Hibernate - update ?? không xóa d? li?u c?
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=import.sql

# JWT - c?u hình ký và xác th?c token
# Khóa private ?? ký JWT (t?o b?ng l?nh: openssl genrsa -out privateKey.pem 2048)
smallrye.jwt.sign.key.location=privateKey.pem
# Khóa public ?? xác th?c JWT (t?o b?ng: openssl rsa -in privateKey.pem -pubout -out publicKey.pem)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://coolstore.vn

# Th?i gian hi?u l?c token: 24 gi? (giây)
coolstore.jwt.duration=86400
coolstore.jwt.issuer=https://coolstore.vn

# Swagger UI
quarkus.swagger-ui.always-include=true