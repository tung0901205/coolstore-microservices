# ============================================================
# AUTH SERVICE - application.properties (S?A L?I ??NG NH?P)
#
# S?A CHÍNH: Xóa dòng %dev.quarkus.hibernate-orm.sql-load-script
# vì nó gây conflict v?i dòng global ? import.sql ch?y 2 l?n
# ? INSERT trùng ID ? transaction rollback ? b?ng tr?ng ? login fail
# ============================================================

%dev.quarkus.http.port=8089

quarkus.log.category."org.hibernate.validator".level=DEBUG
quarkus.http.access-log.enabled=true 

# CORS
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coolstore

%prod.quarkus.datasource.username=quarkus
%prod.quarkus.datasource.password=quarkus
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://auth-database:5432/coolstore

# ============================================================
# Hibernate - drop-and-create ?? t? t?o sequence app_user_seq
# S?A: Ch? có 1 dòng sql-load-script (global), XÓA dòng %dev
# ============================================================
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update

quarkus.hibernate-orm.log.sql=false
# CH? 1 DÒNG NÀY - KHÔNG có %dev.quarkus.hibernate-orm.sql-load-script
quarkus.hibernate-orm.sql-load-script=import.sql

# JWT
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://coolstore.vn

coolstore.jwt.duration=86400
coolstore.jwt.issuer=https://coolstore.vn

# Swagger UI
quarkus.swagger-ui.always-include=true