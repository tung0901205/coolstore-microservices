# ============================================================
# ORDER SERVICE - application.properties
# Port dev: 8086 (gi? nguyên port g?c)
# ============================================================

%dev.quarkus.http.port=8086

# CORS
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=Tranhuong222@
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coolstore

%prod.quarkus.datasource.username=quarkus
%prod.quarkus.datasource.password=quarkus
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://order-database:5432/coolstore

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# JWT - dùng public key GI?NG H?T auth-service ?? xác th?c token
# Copy publicKey.pem t? auth-service sang th? m?c resources c?a order-service
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://coolstore.vn

# Swagger UI
quarkus.swagger-ui.always-include=true

%dev.quarkus.rest-client."org.coolstore.order.client.InventoryServiceClient".url=http://localhost:8081
%prod.quarkus.rest-client."org.coolstore.order.client.InventoryServiceClient".url=http://inventory-service:8081
quarkus.rest-client."org.coolstore.order.client.InventoryServiceClient".scope=jakarta.inject.Singleton
